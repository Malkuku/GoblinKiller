                                <span>当前状态：${isPresent ? '在场' : '离场'}</span>
                            </div>
                        </div>
                        <div style="display:flex; gap: 8px;">
                            <button class="${isPresent ? 'mgmt-btn-unequip' : 'mgmt-btn-equip'}" onclick="window.toggleCharacterPresence('${charName}', ${!isPresent})">
                                ${isPresent ? '设为离场' : '设为在场'}
                            </button>
                            <button class="${isMasked ? 'mgmt-btn-unmask' : 'mgmt-btn-mask'}" onclick="window.toggleMaskCharacter('${charName}', ${!isMasked})">
                                ${isMasked ? '解除屏蔽' : '屏蔽增加'}
                            </button>
                            <button class="mgmt-btn-del" onclick="deleteData('关系列表.${charName}', '${charName}')">删除角色</button>
                        </div>
                    </div>`;

        const charSnaps = data['资源快照'] || {};
        const snapContent = renderSnapList(charSnaps, `关系列表.${charName}`);

        if (snapContent) {
          html += `<div style="font-size:11px; font-weight:900; color:#2d5a27; margin-bottom:8px; text-transform:uppercase; letter-spacing:1px;">资源快照列表:</div>
                                 <div class="mgmt-item-list">${snapContent}</div>`;
        } else {
          html += `<div class="mgmt-empty" style="padding:40px 0;">该角色暂无资源快照</div>`;
        }
        return html;
      };

      let charMgmtHtml = `<div class="mgmt-section">
                            <div class="mgmt-section-header">
                                <div class="mgmt-section-title">
                                    ${getSVG('nav_social', {size:16})} 角色管理
                                    <span style="font-size:10px; color:#1a0f0a; margin-left:12px; font-weight:normal; opacity:0.6;">屏蔽: 完全不发送该角色的变量</span>
                                </div>
                            </div>
                            <div class="social-wrapper" style="height: 340px; margin: 0; border-top: 1px solid rgba(0,0,0,0.05); background:rgba(0,0,0,0.01);">
                                <div class="social-sidebar" style="width: 130px; border-right: 1.5px solid var(--paper-shadow);">
                                    <div class="sidebar-list">
                                        ${Object.keys(relations).map(name => {
        const isActive = mgmtSelectedCharName === name;
        const charData = relations[name];
        return `<div class="sidebar-item ${isActive ? 'active' : ''}" style="padding: 10px 12px;" onclick="window.selectMgmtChar('${name}')">
                                                <div class="sidebar-item-main">
                                                    <span class="sidebar-item-name ${charData.屏蔽 ? 'masked' : ''}" style="font-size:12px;">${name}</span>
                                                    <div class="sidebar-item-meta" style="font-size:9px;">${charData.职业 || '未知职业'}</div>
                                                </div>
                                            </div>`;
      }).join('') || '<div class="mgmt-empty">暂无角色</div>'}
                                    </div>
                                </div>
                                <div class="social-main" style="padding: 15px; background:transparent;">
                                    ${mgmtSelectedCharName && relations[mgmtSelectedCharName]
        ? renderMgmtCharDetail(mgmtSelectedCharName, relations[mgmtSelectedCharName])
        : '<div class="mgmt-empty" style="margin-top: 100px;">请从左侧列表选择角色</div>'}
                                </div>
                            </div>
                          </div>`;

      $container.append(charMgmtHtml);

      // 6. 批量操作栏
      $container.append(`
                    <div id="mgmt-bulk-bar" class="mgmt-bulk-bar" style="display:none;">
                        <div style="font-size:12px;">已选中 <span class="count" style="font-weight:900; color:var(--brass-gold);">0</span> 项内容</div>
                        <button id="bulk-del-confirm" class="mgmt-bulk-btn btn-del" onclick="bulkDeleteData()">批量删除</button>
                    </div>
                `);
      updateMgmtBulkBar();
    }

    function updateUI() {
      const msgId = typeof getCurrentMessageId === 'function' ? getCurrentMessageId() : 'latest';
      const all_vars = getVariables({ type: 'message', message_id: msgId }) || {};
      const stat = all_vars.stat_data || {};
      const rootKey = '主角';
      const 主角对象 = stat[rootKey] || {};

      // 1. 顶部资源同步
      $('#val-time').text(_.get(stat, '世界.当前时间', '...'));
      $('#val-loc').text(主角对象.所在地 || stat['世界'].所在地 || '漂泊中');
      $('#map-loc-display').text(主角对象.所在地 || stat['世界'].所在地 || '未知领域');
      $('#val-gold').text(_.get(主角对象, '背包.金钱.金币', 0));
      $('#val-silver').text(_.get(主角对象, '背包.金钱.银币', 0));
      $('#val-copper').text(_.get(主角对象, '背包.金钱.铜币', 0));

      // 2. 身份信息
      $('#protagonist-name').text(主角对象.姓名 || '{{user}}');
      $('#protagonist-race').text(主角对象.种族 || '人类');
      $('#protagonist-rank').text(主角对象.层级 || '白瓷');

      // 职业信息同步 (P1)
      const currentJobs = _.toPairs(主角对象.职业 || {});
      if (currentJobs.length > 0) {
        const [jobName, jobData] = currentJobs[0];
        $('#protagonist-job').text(`[${jobName}]`);
        $('#protagonist-job-lv').text(`Lv.${jobData.当前等级 || 1}`);
        const curExp = jobData.当前经验 || 0;
        const maxExp = jobData.升级所需 || 1000;
        $('#protagonist-job-exp').text(`${curExp}/${maxExp}`);
      } else {
        $('#protagonist-job').text('[无业者]');
        $('#protagonist-job-lv').text('Lv.0');
        $('#protagonist-job-exp').text('0/0');
      }

      // 3. 资源条同步
      const syncGauge = (id, resPath, clr) => {
        const res = _.get(主角对象, resPath, { 当前值: 0, 最大值: 0 });
        const cur = res.当前值 || 0; const max = res.最大值 || 0;
        const perc = max > 0 ? (cur / max) * 100 : 0;
        const $g = $(`#gauge-${id}`);
        $g.find('.gauge-bar-fill').css({'width': perc + '%', 'background-color': clr});
        $g.find('.gauge-num').text(`${cur}/${max}`);
        const segWidth = max > 0 ? (100 / max) : 0;
        $g.find('.gauge-ticks').css('background-size', segWidth + '% 100%');
      };
      syncGauge('hp', '生命值', 'var(--clr-hp)');
      syncGauge('mp', '魔力值', 'var(--clr-mp)');
      syncGauge('sta', '体力值', 'var(--clr-sta)');
      syncGauge('arm', '护甲值', 'var(--clr-arm)');
      syncGauge('fth', '信仰力值', 'var(--clr-fth)');

      // 4. 装备与技艺抽屉渲染逻辑
      const renderDrawers = (containerId, recordPath, iconName, isSkill = false) => {
        const record = _.get(主角对象, recordPath, {});
        const $list = $(`#${containerId}`);
        const validItems = _.toPairs(record).filter(([k, v]) => v && v !== '待初始化');

        if (validItems.length === 0) {
          $list.html(`<div style="padding:15px; color:#666; font-size:12px; text-align:center; opacity:0.6;">暂无记录</div>`);
          return;
        }

        let html = '';
        validItems.forEach(([name, item]) => {
          if (isSkill) {
            const prof = item.熟练度 || 0;
            const costHtml = item.cost ? `<span class="drawer-tag" style="background:rgba(166,44,43,0.1); color:var(--highlight-red); border:1px solid rgba(166,44,43,0.1);">COST: ${item.cost}</span>` : '';
            html += `
                              <div class="equip-drawer" onclick="$(this).toggleClass('active')">
                                  <div class="drawer-summary">
                                      <span class="drawer-icon">${getSVG(getItemIcon(item) || iconName, { size: 14 })}</span>
                                      <span class="drawer-name"><span class="gradient-text rank-${item.level || '初级'}">${name}</span></span>
                                      <span class="drawer-tag">${item.tier || 'T1'}</span>
                                      <span class="gradient-text rank-${item.level || '初级'}" style="font-size:11px;">${item.level || '初级'}</span>
                                      <span class="drawer-arrow">❯</span>
                                  </div>
                                  <div class="drawer-content">
                                      <div style="font-style:italic; line-height:1.5; color:#444; margin-bottom:10px;">${item.description || '暂无详细描述。'}</div>
                                      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                                          <div style="font-size:11px; font-weight:900; color:#000;">${item.type || '主动'}技艺 ${costHtml}</div>
                                          <div style="font-size:10px; color:#666;">熟练度: ${prof}%</div>
                                      </div>
                                      <div class="attr-exp-bar" style="height:6px;">
                                          <div class="attr-exp-fill" style="width:${prof}%; background-color:var(--wood-dark);"></div>
                                          <div class="gauge-ticks" style="background-size: 10% 100%;"></div>
                                      </div>
                                      ${item.effect ? `<div class="equip-effect-item" style="margin-top:10px;"><strong>[效果]</strong>${item.effect}</div>` : ''}
                                  </div>
                              </div>`;
          } else {
            const valText = item.armor_value ? `护甲+${item.armor_value}` : (item.hands || item.type || item.位置 || '');
            const partHtml = item.part ? `<span class="drawer-tag-part">${item.part}</span>` : '';
            let effectsHtml = '';
            if (!_.isEmpty(item.special_effects)) {
              _.forOwn(item.special_effects, (eff, effName) => {
                effectsHtml += `<div class="equip-effect-item"><strong>[${effName}]</strong>${eff}</div>`;
              });
            }
            html += `
                              <div class="equip-drawer" onclick="$(this).toggleClass('active')">
                                  <div class="drawer-summary">
                                      <span class="drawer-icon" style="opacity:0.7;">${getSVG(getItemIcon(item) || iconName, { size: 14 })}</span>
                                      <span class="drawer-name"><span class="gradient-text tier-${item.tier || '普通'}">${item.name || item.名称 || name}</span></span>
                                      ${partHtml}
                                      <span class="drawer-tag"><span class="gradient-text tier-${item.tier || '普通'}">${item.tier || '普通'}</span></span>
                                      <span style="font-size:11px; font-weight:900; color:#444;">${valText}</span>
                                      <span class="drawer-arrow">❯</span>
                                  </div>
                                  <div class="drawer-content">
                                      <div style="font-style:italic; line-height:1.5; color:#444; border-bottom: ${effectsHtml ? '1px dashed rgba(0,0,0,0.1)' : 'none'}; padding-bottom: ${effectsHtml ? '8px' : '0'};">
                                        ${item.description || item.整体介绍 || '暂无详细描述。'}
                                      </div>
                                      ${effectsHtml}
                                  </div>
                              </div>`;
          }
        });
        $list.html(html);
      };

      renderDrawers('weapon-list', '装备.武器', 'weapon');
      renderDrawers('armor-list', '装备.防具', 'armor');
      renderDrawers('acc-list', '装备.饰品', 'acc'); // 饰品挂载
      renderDrawers('asset-list', '资产', 'asset'); // 资产不动产

      // 4.5 资源快照渲染 (New)
      const renderSnapshots = () => {
        let html = '';
        const snapshotData = [];

        // 主角快照
        if (主角对象.资源快照 && !_.isEmpty(主角对象.资源快照)) {
          snapshotData.push({ name: 主角对象.姓名 || '{{user}}', snapshots: 主角对象.资源快照 });
        }

        // 关系列表快照
        const relations = stat['关系列表'] || {};
        _.forOwn(relations, (char, name) => {
          if (char && char !== '待初始化' && char.资源快照 && !_.isEmpty(char.资源快照)) {
            snapshotData.push({ name: name, snapshots: char.资源快照 });
          }
        });

        if (snapshotData.length === 0) {
          $('#snapshot-list').html(`<div style="padding:15px; color:#666; font-size:12px; text-align:center; opacity:0.6;">暂无快照记录</div>`);
          return;
        }

        snapshotData.forEach(item => {
          let innerHtml = '';
          _.forOwn(item.snapshots, (resTypeRecord, resType) => {
            if (resTypeRecord === '待初始化' || _.isEmpty(resTypeRecord)) return;
            if (typeof resTypeRecord === 'string') {
              innerHtml += `<div class="equip-effect-item"><strong>[${resType}]</strong> ${resTypeRecord}</div>`;
              return;
            }
            _.forOwn(resTypeRecord, (snap, snapId) => {
              if (snap === '待初始化') return;
              const effect = snap.效果 || 0;
              const effectStr = effect >= 0 ? `+${effect}` : `${effect}`;
              const timeStr = snap.时间 ? ` <small style="opacity:0.5;">(${snap.时间})</small>` : '';
              innerHtml += `<div class="equip-effect-item"><strong>[${resType}]</strong> ${snapId}: <span style="color:${effect >= 0 ? '#2d5a27' : '#a62c2b'}; font-weight:900;">${effectStr}</span>${timeStr}</div>`;
            });
          });

          if (innerHtml) {
            html += `
                              <div class="equip-drawer" onclick="$(this).toggleClass('active')">
                                  <div class="drawer-summary">
                                      <span class="drawer-icon" style="opacity:0.7;">${getSVG('intel', { size: 14 })}</span>
                                      <span class="drawer-name">${item.name} 的资源快照</span>
                                      <span class="drawer-arrow">❯</span>
                                  </div>
                                  <div class="drawer-content">
                                      ${innerHtml}
                                  </div>
                              </div>`;
          }
        });
        $('#snapshot-list').html(html || `<div style="padding:15px; color:#666; font-size:12px; text-align:center; opacity:0.6;">暂无有效快照</div>`);
      };
      renderSnapshots();

      // 渲染当前状态 (Buffs/Debuffs)
      const statuses = 主角对象.当前状态 || {};
      let statusHtml = '';
      _.forOwn(statuses, (s, name) => {
        if (s === '待初始化') return;
        const sType = s.type || s.类型 || '临时';
        const sLv = s.level ? `<span class="status-lv">Lv.${s.level}</span>` : '';
        const sColor = sType === '永久' ? '#1a237e' : (sType === '诅咒' || sType === '异常' ? '#b71c1c' : '#5d4037');
        statusHtml += `
                      <div class="status-tag" data-type="${sType}" onclick="$(this).toggleClass('active')">
                          <div class="status-tag-main">
                              ${getSVG('potion', { size: 12, color: sColor })}
                              <span>${name}</span>${sLv}
                          </div>
                          <div class="status-tag-desc">${s.description || '暂无详细记载。'}</div>
                      </div>`;
      });
      $('#status-list').html(statusHtml || '<div style="font-size:11px; color:#999; font-style:italic;">身心状态尚且平稳</div>');

      // 渲染职业技能树
      const jobs = 主角对象.职业 || {};
      const learnedSkills = 主角对象.技能列表 || {};
      const skillPoints = _.get(主角对象, '技能点', 0);
      let treeHtml = '';

      const placeholderHtml = `
                  <div class="job-tree-section">
                      <div style="font-size:13px; font-weight:900; color:var(--wood-dark); margin-bottom:10px;">职业体系 (Class System)</div>
                      <div class="st-placeholder">
                          ${getSVG('skill', { size: 70, color: 'var(--wood-light)', style: 'opacity:0.3; animation: st-pulse 5s infinite;' })}
                          <div class="st-placeholder-text">尚未感应到职业共鸣</div>
                          <div style="font-size:10px; color:#999; margin-top:5px;">觉醒职业以解锁技能树</div>
                      </div>
                  </div>`;

      if (_.isEmpty(jobs)) {
        $('#job-tree-container').html(placeholderHtml);
      } else {
        _.forOwn(jobs, (jobData, jobName) => {
          if (jobData === '待初始化') return;
          const jobLv = jobData.当前等级 || 1;
          const treeDef = skillTreeData ? skillTreeData[jobName] : null;
          if (!treeDef) { treeHtml += placeholderHtml; return; }

          let nodesHtml = '';
          (treeDef.skills || []).forEach(s => {
            const isLearned = !!learnedSkills[s.name];
            let state = 'locked';

            // 检查前置
            const depsMet = (s.dependencies || []).every(d => {
              const skillId = d.skill_id || d.name;
              // 核心修复：根据 ID 找名称，再根据名称找已学技能
              const targetSkillDef = (treeDef.skills || []).find(f => f.id === skillId || f.name === skillId);
              const targetName = targetSkillDef ? targetSkillDef.name : skillId;
              const isMet = !!learnedSkills[targetName];
              return isMet;
            });
            const lvMet = jobLv >= (s.levels?.[0]?.required_job_level || 1);

            if (isLearned) state = 'mastered';
            else if (depsMet && lvMet) state = 'available';

            // 研习显示：优先读取技能自身 sp_cost，否则按 tier 自动推导
            const getSpCostByTier = (tier) => {
              const normalizedTier = String(tier || 'T1').toUpperCase().trim();
              const spCostMap = { T1: 1, T2: 2, T3: 3, T4: 4 };
              return spCostMap[normalizedTier] || 1;
            };
            const spCost = s.sp_cost || getSpCostByTier(
              s.tier ||
              s.levels?.[0]?.tier ||
              treeDef.tier ||
              'T1'
            );
            const effect = s.levels?.[0]?.description || '暂无详细效果描述。';

            nodesHtml += `
                          <div class="st-item ${state}" onclick="$(this).toggleClass('active')">
                              <div class="st-item-summary">
                                  <div class="st-item-title">
                                      <span class="st-item-name">${s.name}</span>
                                      <span class="st-item-type-tag">${s.type}</span>
                                  </div>
                                  <div class="st-item-status">
                                      ${state === 'mastered' ?
              '<span style="color:#8b6508;">已掌握</span>' :
              (state === 'available' ? `<span style="color:var(--highlight-red);">可研习</span>` : '<span style="color:#999;">锁定</span>')}
                                      <span class="st-arrow">❯</span>
                                  </div>
                              </div>
                              <div class="st-item-content" onclick="event.stopPropagation()">
                                  <div class="st-item-desc">${s.description || '暂无技能概述。'}</div>
                                  <div class="st-item-effect"><strong>[效果]</strong> ${effect}</div>
                                  <div class="st-item-footer">
                                      <div class="st-item-req">需求: Lv.${s.levels?.[0]?.required_job_level || 1}${s.dependencies?.length ? ` / 前置: ${s.dependencies.map(d => d.name || d.skill_id).join(', ')}` : ''}</div>
                                      ${state === 'available' ?
              `<button class="st-btn-learn" onclick="learnSkill('${jobName}', '${s.name}')">点击研习 (${spCost} SP)</button>` :
              (state === 'mastered' ? `<span class="st-mastered-tag">已掌握 ${getSVG('check', { size: 14 })}</span>` : '<span style="font-size:11px; color:#999; font-weight:900;">尚未满足研习条件</span>')}
                                  </div>
                              </div>
                          </div>`;
          });

          // 职业进阶面板逻辑
          let promotionHtml = '';
          const nextTierName = treeDef.next_tier;

          if (nextTierName) {
            const promoReq = treeDef.advancement_requirements || treeDef.promotion_requirements || {};
            const reqLv = promoReq.job_level || promoReq.level_req || 10;

            let allMet = true;
            let reqDetails = [];

            // 1. 等级检查
            const lvMet = jobLv >= reqLv;
            if (!lvMet) allMet = false;
            reqDetails.push(`<div style="color:${lvMet?'#2d5a27':'#a62c2b'}">${lvMet?'✓':'✗'} 职业等级 Lv.${reqLv} (当前: ${jobLv})</div>`);

            // 2. 属性检查
            if (promoReq.stats) {
              _.forOwn(promoReq.stats, (v, k) => {
                const curV = _.get(主角对象, `能力.${k}`, 0);
                const met = curV >= v;
                if (!met) allMet = false;
                reqDetails.push(`<div style="color:${met?'#2d5a27':'#a62c2b'}">${met?'✓':'✗'} 属性 ${k} ≥ ${v} (当前: ${curV})</div>`);
              });
            }

            // 3. 技能检查
            if (promoReq.skills) {
              const lvMap = { 1:'初级', 2:'中级', 3:'高级', 4:'精通', 5:'大师' };
              promoReq.skills.forEach(rs => {
                const skillId = rs.skill_id || rs.name;
                const curS = learnedSkills[rs.name] || learnedSkills[rs.skill_id] || learnedSkills[skillId];

                // 尝试从定义中获取显示名称
                let displayName = rs.name;
                if (!displayName && treeDef.skills) {
                  const def = treeDef.skills.find(s => s.id === skillId || s.name === skillId);
                  if (def) displayName = def.name;
                }
                if (!displayName) displayName = skillId;

                const getLv = (s) => {
                  const m = { '初级': 1, '中级': 2, '高级': 3, '精通': 4, '大师': 5 };
                  return typeof s === 'object' ? (m[s.level] || s.等级 || 0) : (m[s] || 0);
                };
                const reqLvNum = typeof rs.level === 'number' ? rs.level : ({ '初级': 1, '中级': 2, '高级': 3, '精通': 4, '大师': 5 }[rs.level] || 1);
                const met = getLv(curS) >= reqLvNum;
                if (!met) allMet = false;
                reqDetails.push(`<div style="color:${met?'#2d5a27':'#a62c2b'}">${met?'✓':'✗'} 技艺 ${displayName} ≥ ${lvMap[rs.level] || rs.level}</div>`);
              });
            }

            promotionHtml = `
                          <div class="job-promo-section">
                              <div class="job-promo-title">${getSVG('armor', { size: 14 })} 职业进阶：${nextTierName}</div>
                              <div class="job-promo-req">
                                  ${reqDetails.join('')}
                              </div>
                              ${allMet ?
              `<button class="job-promo-btn" onclick="promoteJob('${jobName}', '${nextTierName}')">进行进阶挑战 (突破)</button>` :
              `<button class="job-promo-btn locked" disabled>进阶条件不足</button>`}
                          </div>`;
          }

          const jobExp = jobData.当前经验 || 0;
          const jobMaxExp = jobData.升级所需 || 1000;
          const jobExpPerc = Math.min(100, (jobExp / jobMaxExp) * 100);

          treeHtml += `
                      <div class="job-tree-section">
                          <div class="job-info-banner">
                              <div class="job-header-card">
                                  <div class="job-seal">Lv.${jobLv}</div>
                                  <div class="job-info-main">
                                      <div style="font-size:16px; font-weight:900; color:#000; display:flex; justify-content:space-between; align-items:center;">
                                          <span>${jobName} <span style="font-size:10px; color:var(--highlight-red);">[${treeDef.tier || '初期'}]</span></span>
                                          <span style="font-size:10px; color:#666;">晋升: ${nextTierName || '顶点'}</span>
                                      </div>
                                      <div class="job-exp-wrap">
                                          <div class="job-exp-text"><span>EXP PROGRESS</span><span>${jobExp}/${jobMaxExp}</span></div>
                                          <div class="job-exp-bar"><div class="job-exp-fill" style="width:${jobExpPerc}%"></div></div>
                                      </div>
                                  </div>
                              </div>
                              <div class="job-desc-text">${treeDef.description || '关于该职业的记载已随风而逝...'}</div>
                              ${promotionHtml}
                          </div>
                          <div class="st-list">${nodesHtml}</div>
                      </div>`;
        });
        $('#job-tree-container').html(treeHtml);
      }

      // 5. 公会记录渲染
      const guild = 主角对象.公会信息 || {};
      $('#guild-name').text(guild.所属公会 || '无名公会');
      $('#guild-rank').text(guild.公会阶级 || '未授阶');
      const cv = guild.贡献度 || '0/100';
      $('#guild-cv-text').text(cv);
      let cvPerc = 0;
      if (typeof cv === 'string' && cv.includes('/')) {
        const pts = cv.split('/');
        const cur = parseFloat(pts[0]); const nxt = parseFloat(pts[1]);
        if (!isNaN(cur) && !isNaN(nxt) && nxt > 0) cvPerc = Math.min(100, (cur / nxt) * 100);
        else if (pts[1] === 'MAX') cvPerc = 100;
      }
      $('#guild-cv-bar').css('width', cvPerc + '%');

      // 6. 能力面板同步
      const attrs = ['力量', '敏捷', '感知', '知识', '魅力', '魔力', '信仰力'];
      let attrHtml = '';
      attrs.forEach(a => {
        const val = _.get(主角对象, `能力.${a}`, 5);
        const prog = _.get(主角对象, `历练进度.${a}`, 0);
        attrHtml += `
                      <div class="attr-card">
                          <div class="attr-label">${a}</div>
                          <div class="attr-value">${val}</div>
                          <div class="attr-exp-bar">
                              <div class="attr-exp-fill" style="width:${prog}%"></div>
                              <div class="gauge-ticks" style="background-size: 10% 100%;"></div>
                          </div>
                      </div>`;
      });
      $('#attr-grid-container').html(attrHtml);
      $('#skill-points').text(_.get(主角对象, '技能点', 0));
      renderDrawers('skill-list-container', '技能列表', 'skill', true);

      // 7. 行囊渲染逻辑 (Panel P3) - 修正路径对齐 Schema
      const $p3 = $('.stb-panel.p3');
      $p3.find('.bag-controls').remove();
      $p3.prepend(`
                  <div class="bag-controls">
                      <div class="bag-ctrl-group">
                          <span class="bag-ctrl-label">排序:</span>
                          <button class="layout-btn ${currentBagSort === 'type' ? 'active' : ''}" onclick="toggleBagSort('type')"><span>类型</span></button>
                          <button class="layout-btn ${currentBagSort === 'tier' ? 'active' : ''}" onclick="toggleBagSort('tier')"><span>品质</span></button>
                          <button class="layout-btn ${currentBagSort === 'quantity' ? 'active' : ''}" onclick="toggleBagSort('quantity')"><span>数量</span></button>
                      </div>
                      <div class="bag-ctrl-group">
                          <span class="bag-ctrl-label">布局:</span>
                          <button class="layout-btn ${currentBagLayout === 'list' ? 'active' : ''}" onclick="toggleBagLayout('list')">
                              ${getSVG('list')}
                              <span>列表</span>
                          </button>
                          <button class="layout-btn ${currentBagLayout === 'grid' ? 'active' : ''}" onclick="toggleBagLayout('grid')">
                              ${getSVG('grid')}
                              <span>格子</span>
                          </button>
                      </div>
                  </div>
              `);

      const bagData = 主角对象.背包 || {};
      const $bagContainer = $('#bag-content');

      // 整合所有类别的物品
      const bagCats = {
        '消耗品': bagData.消耗品 || {},
        '材料': bagData.材料 || {},
        '饰品': bagData.饰品 || {},
        '杂物': bagData.杂物 || {},
        '武器': bagData.武器 || {},
        '防具': bagData.防具 || {}
      };

      if (_.every(bagCats, _.isEmpty)) {
        $bagContainer.html('<div style="padding:50px 20px; text-align:center; opacity:0.5; font-weight:900;">行囊空空如也</div>');
      } else {
        let bagHtml = '';
        const catIconsMap = { '消耗品': 'potion', '材料': 'material', '饰品': 'acc', '杂物': 'misc', '武器': 'weapon', '防具': 'armor' };


        // 数据预处理：根据排序维度整理
        let renderData = {};
        const tierOrder = { '传说': 0, '史诗': 1, '稀有': 2, '普通': 3 };

        if (currentBagSort === 'type') {
          renderData = bagCats;
        } else {
          let flatList = [];
          _.forOwn(bagCats, (items, cat) => {
            Object.entries(items).forEach(([name, item]) => {
              if (item !== '待初始化') flatList.push({ ...item, name, rawCat: cat });
            });
          });
          if (currentBagSort === 'tier') {
            flatList.sort((a, b) => (tierOrder[a.tier] ?? 9) - (tierOrder[b.tier] ?? 9));
            renderData = { '按品质排序': flatList };
          } else if (currentBagSort === 'quantity') {
            flatList.sort((a, b) => (b.quantity || 0) - (a.quantity || 0));
            renderData = { '按数量排序': flatList };
          }
        }

        if (currentBagLayout === 'list') {
          _.forOwn(renderData, (items, groupName) => {
            if (_.isEmpty(items)) return;
            const itemList = Array.isArray(items) ? items : Object.entries(items).map(([n, d]) => ({ ...d, name: n, rawCat: groupName }));
            bagHtml += `
                          <div class="bag-cat-wrap">
                              <div class="equip-cat-title">${groupName}</div>
                              <div style="margin-top:8px;">
                                  ${itemList.map(item => {
              if (item === '待初始化') return '';
              const tierColor = getTierColor(item.tier || '普通');

              let itemEffects = '';
              if (!_.isEmpty(item.special_effects)) {
                _.forOwn(item.special_effects, (eff, effName) => {
                  itemEffects += `<div style="color:var(--highlight-red); font-weight:900;">[${effName}] ${eff}</div>`;
                });
              } else if (item.effect) {
                itemEffects = `<div style="color:var(--highlight-red); font-weight:900;">[效果] ${item.effect}</div>`;
              }

              const itemCat = item.rawCat || groupName;
              return `
                                      <div class="bag-item" onclick="$(this).toggleClass('active')">
                                          <div class="bag-item-header">
                                              <div class="bag-item-icon">
                                                  ${getSVG(getItemIcon(item) || catIconsMap[itemCat] || 'misc', { color: getTierColor(item.tier), size: 24 })}</div>
                                              <div class="bag-item-name">
                                                  <span class="gradient-text tier-${item.tier || '普通'}">${item.name}</span>
                                                  ${item.part ? `<small style="opacity:0.8; font-size:10px;">[${item.part}]</small>` : ''}
                                              </div>
                                              <div class="bag-item-count">×${item.quantity || 1}</div>
                                              <div class="drawer-arrow">❯</div>
                                          </div>
                                          <div class="bag-item-detail">
                                              <div style="font-style:italic; margin-bottom:8px;">${item.description || '一两件不值一提的小玩意。'}</div>
                                              ${itemEffects}
                                              <div style="font-size:10px; color:#5c4033; margin-top:8px; display:grid; grid-template-columns: repeat(2, 1fr); gap: 4px; font-weight: 900;">
                                                  <span><span style="opacity:0.8;">[类型]</span> ${item.type || item.类型 || itemCat}</span>
                                                  <span><span style="opacity:0.8;">[品质]</span> <span class="gradient-text tier-${item.tier || '普通'}">${item.tier || '普通'}</span></span>
                                                  ${item.part ? `<span><span style="opacity:0.8;">[部位]</span> ${item.part}</span>` : ''}
                                                  ${item.hands ? `<span><span style="opacity:0.8;">[持握]</span> ${item.hands}</span>` : ''}
                                                  ${item.armor_value ? `<span><span style="opacity:0.8;">[护甲]</span> ${item.armor_value}</span>` : ''}
                                              </div>
                                          </div>
                                      </div>`;

            }).join('')}
                              </div>
                          </div>`;
          });
        } else {
          // 格子布局 (Grid View) - 分类显示
          let gridHtml = `<div class="bag-grid-main">`;
          _.forOwn(renderData, (items, groupName) => {
            if (_.isEmpty(items)) return;
            const itemList = Array.isArray(items) ? items : Object.entries(items).map(([n, d]) => ({ ...d, name: n, rawCat: groupName }));
            gridHtml += `
                          <div class="bag-cat-wrap">
                              <div class="equip-cat-title" style="background:rgba(0,0,0,0.05); color:var(--wood-light); border:1px solid var(--paper-shadow); padding: 2px 10px; font-size:10px;">${groupName}</div>
                              <div class="bag-grid-view" style="margin-top:5px; margin-bottom:15px;">
                                  ${itemList.map(item => {
              if (item === '待初始化') return '';
              const tierColor = getTierColor(item.tier || '普通');
              const isSelected = selectedBagItem && selectedBagItem.name === item.name;
              const encoded = encodeURIComponent(JSON.stringify(item));
              const itemCat = item.rawCat || groupName;
              return `
                                      <div class="bag-slot-wrapper" onclick="selectGridItem('${itemCat}', '${item.name}', '${encoded}')">
                                          <div class="bag-slot-label" title="${item.name}"><span class="gradient-text tier-${item.tier || '普通'}">${item.name}</span></div>
                                          <div class="bag-slot ${isSelected ? 'selected' : ''}"
                                              data-name="${item.name}"
                                              title="${item.name}">
                                              <div class="bag-slot-icon">${getSVG(getItemIcon(item) || catIconsMap[itemCat] || 'misc', { color: tierColor, size: 28 })}</div>
                                              <div class="bag-slot-count">${item.quantity || 1}</div>
                                          </div>
                                      </div>`;
            }).join('')}
                              </div>
                          </div>`;
          });
          gridHtml += `</div>`;
          bagHtml = `<div class="bag-grid-layout">${gridHtml}<div class="bag-info-side" id="bag-detail-zone"><div style="text-align:center; padding-top:80px; opacity:0.3; font-weight:900;">选择物品以查看</div></div></div>`;
        }

        $bagContainer.html(bagHtml);
      }
      // 8. 志事渲染 (Panel P4)
      renderWorld(stat['世界'] || {});
      renderQuests(主角对象.任务日志 || {});

      // 9. 社交渲染 (Panel P5)
      renderSocial(stat['关系列表'] || {}, stat['敌人列表'] || {});
      renderManagement(stat, 主角对象);

      // 11. 宠物系统渲染 (P7)
      const pets = all_vars.stat_data?.宠物 || {};
      const $petContainer = $('#pet-list-container');

      if (_.isEmpty(pets) || _.every(pets, v => v === '待初始化')) {
        $petContainer.html('<div style="padding:50px 20px; text-align:center; opacity:0.5; font-weight:900;">暂无宠物随行</div>');
      } else {
        let petHtml = '';
        _.forOwn(pets, (pet, name) => {
          if (pet === '待初始化') return;
          const traits = _.toPairs(pet.词条 || {}).map(([k,v]) => `<span class="pet-trait-tag">${k}: ${v}</span>`).join('');
          const petEquips = _.toPairs(pet.装备 || {}).map(([en, ed]) => {
            if (ed === '待初始化') return '';
            return `<div class="pet-equip-item" title="${ed.效果 || ''}">
                                      <div class="pet-equip-part">${getSVG('shield', {size:10, color:'#a62c2b'})} ${ed.部位 || '部位'}</div>
                                      <div style="font-weight:900; font-size:12px; color:#1a0f0a;">${en}</div>
                                      <div class="pet-equip-effect">${ed.效果 || ''}</div>
                                  </div>`;
          }).join('');

          petHtml += `
                          <div class="pet-card">
                              <div class="pet-header">
                                  <div class="pet-name-box">
                                      <span class="pet-species">${getSVG('paw', {size:10, color:'#a62c2b'})} ${pet.品类 || '奇珍'}</span>
                                      <span class="pet-name">${name}</span>
                                  </div>
                                  <div class="pet-eval-tag">${pet.评价 || '普通'}</div>
                              </div>
                              <div class="pet-body">
                                  <div class="pet-info-item">
                                      <div class="pet-info-label">${getSVG('intel', {size:10, color:'#8b7355'})} 内在</div>
                                      <div class="pet-info-val">${pet.内在 || '未契合'}</div>
                                  </div>
                                  <div class="pet-info-item">
                                      <div class="pet-info-label">${getSVG('eye', {size:10, color:'#8b7355'})} 外在</div>
                                      <div class="pet-info-val">${pet.外在 || '未显现'}</div>
                                  </div>
                              </div>
                              <div class="pet-trait-list">${traits || `<span style="opacity:0.3; font-size:10px; font-weight:900; margin: 10px auto;">[ 尚未觉醒特殊词条 ]</span>`}</div>
                              ${petEquips ? `<div class="pet-equip-section"><div class="pet-equip-grid">${petEquips}</div></div>` : ''}
                          </div>`;
        });
        $petContainer.html(petHtml);
      }
    }

    function initMapInteraction() {
      const container = document.querySelector('.map-container');
      const img = document.querySelector('.map-img');
      if (!container || !img) return;

      let state = {
        scale: 1,
        x: 0,
        y: 0,
        isDragging: false,
        startX: 0,
        startY: 0,
        lastPinchDist: 0
      };

      const updateTransform = () => {
        img.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
      };

      const zoomAtPoint = (clientX, clientY, nextScale) => {
        const prevScale = state.scale;
        if (nextScale === prevScale) return;

        const rect = container.getBoundingClientRect();
        const pointX = clientX - rect.left;
        const pointY = clientY - rect.top;
        const scaleRatio = nextScale / prevScale;

        state.x = pointX - (pointX - state.x) * scaleRatio;
        state.y = pointY - (pointY - state.y) * scaleRatio;
        state.scale = nextScale;

        if (state.scale <= 1) {
          state.x = 0;
          state.y = 0;
        }

        updateTransform();
      };

      // 滚轮缩放
      container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomSpeed = 0.1;
        const delta = -Math.sign(e.deltaY);
        const nextScale = Math.min(Math.max(1, state.scale + delta * zoomSpeed * state.scale), 8);
        zoomAtPoint(e.clientX, e.clientY, nextScale);
      }, { passive: false });

      // 拖拽逻辑 (Mouse)
      container.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        if (state.scale <= 1) return;
        state.isDragging = true;
        state.startX = e.clientX - state.x;
        state.startY = e.clientY - state.y;
        e.preventDefault();
      });

      container.addEventListener('dragstart', (e) => {
        e.preventDefault();
      });

      window.addEventListener('mousemove', (e) => {
        if (!state.isDragging) return;
        state.x = e.clientX - state.startX;
        state.y = e.clientY - state.startY;
        updateTransform();
      });

      window.addEventListener('mouseup', () => {
        state.isDragging = false;
      });

      // 触控逻辑 (Touch)
      container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          state.lastPinchDist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
          state.isDragging = false;
        } else if (e.touches.length === 1 && state.scale > 1) {
          state.isDragging = true;
          state.startX = e.touches[0].clientX - state.x;
          state.startY = e.touches[0].clientY - state.y;
        }
      });

      container.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          const dist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );

          const zoomSpeed = 0.01;
          const delta = dist - state.lastPinchDist;
          const nextScale = Math.min(Math.max(1, state.scale + delta * zoomSpeed), 8);

          const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
          const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
          zoomAtPoint(centerX, centerY, nextScale);
          state.lastPinchDist = dist;
        } else if (e.touches.length === 1 && state.isDragging) {
          state.x = e.touches[0].clientX - state.startX;
          state.y = e.touches[0].clientY - state.startY;
          updateTransform();
        }
      }, { passive: false });

      container.addEventListener('touchend', () => {
        state.isDragging = false;
        state.lastPinchDist = 0;
      });
    }

    async function init() {
      try {
        if (typeof waitGlobalInitialized === 'function') await waitGlobalInitialized('Mvu');
        await loadSkillTree();
        await loadPortraitDatabase();
        initMapInteraction();
      } catch (e) {
        console.error("初始化数据失败:", e);
      }

      updateUI(); // 无论如何尝试渲染一次
      if (window.Mvu && Mvu.events) {
        eventOn(Mvu.events.VARIABLE_UPDATE_ENDED, updateUI);
      }
    }
    $(errorCatched(init));
  </script>
</head>

  <input type="radio" name="stb-tabs" id="tab1" checked>

  <input type="radio" name="stb-tabs" id="tab4">
  <input type="radio" name="stb-tabs" id="tab5">
  <input type="radio" name="stb-tabs" id="tab8">
  <input type="radio" name="stb-tabs" id="tab6">

  <div class="stb-scroll-main">
    <div class="stb-roller"></div>
    <div class="stb-parchment">
      <!-- 头部 -->
      <div class="stb-header">
        <div class="stb-header-left">
          <script>document.write(getSVG('clock', { size: 14, color: 'var(--wood-light)', style: 'margin-right: 4px;' }));</script>
          <span id="val-time">...</span>
          <span style="margin: 0 8px; opacity: 0.3;">|</span>
          <script>document.write(getSVG('map', { size: 14, color: 'var(--wood-light)', style: 'margin-right: 4px;' }));</script>
          <span id="val-loc">...</span>
        </div>
        <div class="stb-wallet">
          <div class="stb-coin coin-g">● <span id="val-gold">0</span></div>
          <div class="stb-coin coin-s">● <span id="val-silver">0</span></div>
          <div class="stb-coin coin-c">● <span id="val-copper">0</span></div>
          <script>document.write(getSVG('wallet', { size: 14, color: 'var(--wood-light)', style: 'margin-left:4px;' }));</script>
        </div>
      </div>

      <!-- 导航 -->
      <div class="stb-nav">
        <label for="tab1"><script>document.write(getSVG('nav_protagonist', { size: 18, color: 'inherit' }));</script><span>主角</span></label>
        <label for="tab2"><script>document.write(getSVG('nav_ability', { size: 18, color: 'inherit' }));</script><span>能力</span></label>
        <label for="tab7"><script>document.write(getSVG('paw', { size: 18, color: 'inherit' }));</script><span>宠物</span></label>
        <label for="tab3"><script>document.write(getSVG('nav_bag', { size: 18, color: 'inherit' }));</script><span>行囊</span></label>
        <label for="tab4"><script>document.write(getSVG('nav_quests', { size: 18, color: 'inherit' }));</script><span>志事</span></label>
        <label for="tab5"><script>document.write(getSVG('nav_social', { size: 18, color: 'inherit' }));</script><span>社交</span></label>
        <label for="tab8"><script>document.write(getSVG('map', { size: 18, color: 'inherit' }));</script><span>地图</span></label>
        <label for="tab6"><script>document.write(getSVG('nav_mgmt', { size: 18, color: 'inherit' }));</script><span>管理</span></label>
      </div>

      <div class="stb-panels">
        <!-- 主角 P1 -->
        <div class="stb-panel p1">
          <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:15px; border-bottom:2px solid var(--wood-dark); padding-bottom:5px;">
            <div><span style="font-size:26px; font-weight:900; color:#000;" id="protagonist-name">...</span><span style="font-size:12px; color:#333; margin-left:8px; font-weight:bold;">[<span id="protagonist-race"></span>]</span></div>
            <div style="text-align:right;">
              <div style="font-size:13px; font-weight:900;">
                <span id="protagonist-job" style="color:var(--highlight-red);">[无业者]</span>
                <span id="protagonist-job-lv" style="margin-left:4px;">Lv.1</span>
                <span style="margin: 0 4px; opacity:0.3;">/</span>
                <span id="protagonist-rank">白瓷</span>
              </div>
              <div style="font-size:10px; color:#666; font-weight:900; margin-top:2px; font-family:monospace;">EXP: <span id="protagonist-job-exp">0/0</span></div>
            </div>
          </div>

          <!-- 状态面板 -->
          <div id="status-list" class="status-tag-list"></div>

          <!-- 资源条 -->
          <div id="gauge-hp" class="gauge-group"><div class="gauge-header"><span>生命值</span><span class="gauge-num">0/0</span></div><div class="gauge-bar-outer"><div class="gauge-bar-fill"></div><div class="gauge-ticks"></div></div></div>
          <div id="gauge-mp" class="gauge-group"><div class="gauge-header"><span>魔力值</span><span class="gauge-num">0/0</span></div><div class="gauge-bar-outer"><div class="gauge-bar-fill"></div><div class="gauge-ticks"></div></div></div>
